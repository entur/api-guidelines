# API Guidelines Ruleset
# Specs must produce no errors with this ruleset in order to publish to developer-portal

# OpenAPI Specification version 3.x
extends: [spectral:oas]

functions:
  - date
  - xEnturPermissions

rules:
  no-$ref-siblings: "off"
  # These generate too many false positives
  oas3-valid-media-example: "off"
  oas3-valid-schema-example: "off"

  # -------------------------------------------------------------------------
  # 2.3 Authentication and authorization
  # -------------------------------------------------------------------------

  entur-permissions:
    documentationUrl: "https://entur.github.io/api-guidelines/#233-documenting-permissions-for-partner-endpoints"
    severity: error
    given: $.paths.*[get,post,put,patch,delete,options,head,trace].x-entur-permissions
    then:
      function: xEnturPermissions

  # -------------------------------------------------------------------------
  # 2.4 Entur Metadata
  # -------------------------------------------------------------------------

  entur-info-metadata-id:
    message: "The OpenAPI info section MUST include \"x-entur-metadata.id\"."
    documentationUrl: "https://entur.github.io/api-guidelines/#241-identifying-a-specification"
    severity: error
    given: $
    then:
      field: info.x-entur-metadata.id
      function: truthy

  entur-info-metadata-id-kebab-case:
    message: "The \"x-entur-metadata.id\" MUST be in lower-kebab-case format. Invalid value: {{value}}"
    documentationUrl: "https://entur.github.io/api-guidelines/#241-identifying-a-specification"
    severity: error
    given: $.info.x-entur-metadata.id
    then:
      function: pattern
      functionOptions:
        match: ^[a-z0-9]+(-[a-z0-9]+)*$

  entur-info-metadata-audience:
    message: "The OpenAPI info section MUST include \"x-entur-metadata.audience\"."
    documentationUrl: "https://entur.github.io/api-guidelines/#24-entur-metadata"
    severity: error
    given: $
    then:
      field: info.x-entur-metadata.audience
      function: truthy

  entur-info-metadata-audience-valid:
    documentationUrl: "https://entur.github.io/api-guidelines/#24-entur-metadata"
    severity: error
    given: $.info.x-entur-metadata.audience
    then:
      function: enumeration
      functionOptions:
        values:
          - open
          - partner
          - internal
          - private

  entur-info-metadata-owner:
    message: "The OpenAPI info section MUST include \"x-entur-metadata.owner\"."
    documentationUrl: "https://entur.github.io/api-guidelines/#242-specification-owner"
    severity: error
    given: $
    then:
      field: info.x-entur-metadata.owner
      function: truthy

  entur-info-metadata-owner-valid:
    documentationUrl: "https://entur.github.io/api-guidelines/#242-specification-owner"
    severity: error
    given: $.info.x-entur-metadata.owner
    then:
      function: pattern
      functionOptions:
        match: ^team-[a-z0-9]+(-[a-z0-9]+)*$

  entur-info-metadata-parent-id-kebab-case:
    message: "The \"x-entur-metadata.parentId\" MUST be in lower-kebab-case format. Invalid value: {{value}}"
    documentationUrl: "https://entur.github.io/api-guidelines/#243-merging-specifications"
    severity: error
    given: $.info.x-entur-metadata.parentId
    then:
      function: pattern
      functionOptions:
        match: ^[a-z0-9]+(-[a-z0-9]+)*$

  entur-info-metadata-devExtensions:
    documentationUrl: "https://entur.github.io/api-guidelines/#244-development-only-openapi-extensions"
    severity: error
    given: $.info.x-entur-metadata.devExtensions
    then:
      function: schema
      functionOptions:
        schema:
          type: array
          items:
            type: string
            pattern: ^x-.*$

  # -------------------------------------------------------------------------
  # 2.5 Lifecycle
  # -------------------------------------------------------------------------

  ## On API level
  entur-stability-level-api:
    documentationUrl: "https://entur.github.io/api-guidelines/#25-lifecycle"
    severity: error
    given: $.info.x-stability-level
    then:
      function: enumeration
      functionOptions:
        values: [draft, beta, stable]

  entur-deprecation-api:
    documentationUrl: "https://entur.github.io/api-guidelines/#254-deprecation"
    severity: error
    given: $.info.x-deprecated
    then:
      function: schema
      functionOptions:
        schema:
          type: boolean

  entur-sunset-format-api:
    documentationUrl: "https://entur.github.io/api-guidelines/#254-deprecation"
    severity: error
    given: $.info.x-sunset
    then:
      function: date

  # On individual operation level
  entur-stability-level-operation:
    documentationUrl: "https://entur.github.io/api-guidelines/#25-lifecycle"
    severity: error
    given: $.paths.*[get,post,put,patch,delete,options,head,trace].x-stability-level
    then:
      function: enumeration
      functionOptions:
        values: [draft, beta, stable]

  entur-sunset-format-operation:
    documentationUrl: "https://entur.github.io/api-guidelines/#254-deprecation"
    severity: error
    given: $.paths.*[get,post,put,patch,delete,options,head,trace].x-sunset
    then:
      function: date
