name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate-pr:
    uses: entur/gha-meta/.github/workflows/verify-pr.yml@v1

  test-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: "tests/package.json"
          cache: "yarn"
          cache-dependency-path: "tests/yarn.lock"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run Spectral rule tests
        run: yarn test

  lint-reference-spec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: entur/gha-api/.github/actions/setup-spectral@v6
      - name: Lint OpenAPI
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          
          annotations=$(mktemp)
          markdown=$(mktemp)
          spectral lint ./specs/reference-spec.json --ruleset ".spectral.yml" --show-documentation-url -F hint -f github-actions -o.github-actions "$annotations" -f markdown -o.markdown="$markdown" && rc=$? || rc=$?

          #Return code 2 means that spectral command failed to run (not linting errors), so fail workflow.
          if [ "$rc" -eq 2 ]; then
            echo "::error::Spectral execution error (exit code $rc)."
            exit $rc
          fi

          if [ "$rc" -eq 1 ]; then
            cat $annotations
            cat $markdown >> $GITHUB_STEP_SUMMARY
            echo
            echo "::error::There were linting errors (exit code $rc)."
            exit $rc
          fi

  lint-invalid:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: entur/gha-api/.github/actions/setup-spectral@v6
      - name: Lint OpenAPI
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          
          annotations=$(mktemp)
          markdown=$(mktemp)
          spectral lint ./specs/invalid.json --ruleset ".spectral.yml" --show-documentation-url -F hint -f github-actions -o.github-actions "$annotations" -f markdown -o.markdown="$markdown" && rc=$? || rc=$?

          #Return code 2 means that spectral command failed to run (not linting errors), so fail workflow.
          if [ "$rc" -eq 2 ]; then
            echo "::error::Spectral execution error (exit code $rc)."
            exit $rc
          fi

          if [ "$rc" -ne 1 ]; then
            echo "::error::There were no linting errors when there should be (exit code $rc)."
            exit $rc
          else
            cat $annotations
            cat $markdown >> $GITHUB_STEP_SUMMARY
          fi

  # This spec which is invalid with the full linting rules (.spectral) should still pass linting with .spectral-required
  lint-required-valid:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: entur/gha-api/.github/actions/setup-spectral@v6
      - name: Lint OpenAPI
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          
          annotations=$(mktemp)
          markdown=$(mktemp)
          spectral lint ./specs/required-valid.json --ruleset ".spectral-required.yml" --show-documentation-url -F hint -f github-actions -o.github-actions "$annotations" -f markdown -o.markdown="$markdown" && rc=$? || rc=$?

          #Return code 2 means that spectral command failed to run (not linting errors), so fail workflow.
          if [ "$rc" -eq 2 ]; then
            echo "::error::Spectral execution error (exit code $rc)."
            exit $rc
          fi

          if [ "$rc" -eq 1 ]; then
            echo "::error::There were linting errors when there should not be (exit code $rc)."
            exit $rc
          fi